<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>NEXXI Shopee Category Sync</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 340px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      font-size: 13px;
    }
    .header {
      background: linear-gradient(135deg, #1b2a59, #2b4285);
      color: #fff;
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 12px;
    }
    .header h1 {
      margin: 0 0 4px;
      font-size: 14.5px;
      font-weight: 800;
    }
    .header p {
      margin: 0;
      font-size: 11.5px;
      opacity: 0.88;
    }
    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .status-line {
      font-weight: 700;
      color: #1b2a59;
      margin-bottom: 4px;
    }
    .sub-line {
      font-size: 12px;
      color: #475569;
      line-height: 1.4;
    }
    .btn-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 7px 10px;
      border-radius: 7px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary {
      width: 100%;
      background: #e85d3f;
      color: #fff;
      padding: 9px 12px;
      font-size: 12.5px;
    }
    .btn-primary:hover { background: #d44d30; }
    .btn-navy { background: #1b2a59; color: #fff; }
    .btn-warn { background: #f59e0b; color: #fff; }
    .btn-outline { background: #f1f5f9; color: #1e293b; border: 1px solid #cbd5e1; }
    .btn-danger { background: #dc2626; color: #fff; }
    .note {
      font-size: 11.5px;
      color: #64748b;
      line-height: 1.4;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🏷️ NEXXI Shopee Category Sync</h1>
    <p>Phiên bản v1.0.0 • Liên kết trang Pancake SKU (nexxi.vn)</p>
  </div>

  <div class="card">
    <div class="status-line" id="statusLine">Đang kiểm tra trạng thái...</div>
    <div class="sub-line" id="subLine"></div>
    <div class="btn-row" id="controlRow" style="display:none;">
      <button type="button" class="btn btn-warn" id="btnPause">⏸️ Tạm dừng</button>
      <button type="button" class="btn btn-navy" id="btnResume">▶️ Tiếp tục</button>
      <button type="button" class="btn btn-outline" id="btnSkip">⏭️ Bỏ qua</button>
      <button type="button" class="btn btn-danger" id="btnStop">⏹️ Dừng</button>
    </div>
  </div>

  <button type="button" class="btn btn-primary" id="btnOpenAdmin">🥞 Mở trang Pancake SKU (nexxi.vn)</button>

  <p class="note" style="margin-top:10px;">
    Mở tab Shopee mới theo link từ Pancake POS để lấy Danh mục Tầng 2 (Cha) &amp; Tầng 3 (Con) rồi tự đóng tab lại.
  </p>

  <script src="popup.js"></script>
</body>
</html>
